name: Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'pom.xml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    
    - name: Build with Maven
      run: mvn clean compile package
    
    - name: Get artifact name from pom.xml
      id: get_artifact
      run: |
        ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "ARTIFACT_ID=$ARTIFACT_ID" >> $GITHUB_OUTPUT
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=v${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.get_artifact.outputs.ARTIFACT_ID }}-Build-${{ github.run_number }}
        path: target/*.jar
    
    - name: Validate version format (digits and dots only)
      id: validate_version
      run: |
        VERSION="${{ steps.get_artifact.outputs.VERSION }}"
        
        if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
          echo "VALID=true" >> $GITHUB_OUTPUT
          echo "✓ Version format OK: $VERSION"
        else
          echo "VALID=false" >> $GITHUB_OUTPUT
          echo "INVALID_REASON=Version '$VERSION' contains invalid characters. Only digits and dots allowed (e.g., 1.0, 1.0.0, 2.5.3)" >> $GITHUB_OUTPUT
          echo "❌ Invalid version format: $VERSION"
          echo "   Only digits and dots are allowed"
        fi
    
    - name: Check if release exists
      id: check_release
      if: steps.validate_version.outputs.VALID == 'true'
      run: |
        TAG="v${{ steps.get_artifact.outputs.VERSION }}"
        
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "RELEASE_EXISTS=true" >> $GITHUB_OUTPUT
          echo "RELEASE_EXISTS_MESSAGE=Release $TAG already exists" >> $GITHUB_OUTPUT
          echo "❌ Release $TAG already exists"
        else
          echo "RELEASE_EXISTS=false" >> $GITHUB_OUTPUT
          echo "RELEASE_EXISTS_MESSAGE=Release $TAG does not exist, will create" >> $GITHUB_OUTPUT
          echo "✅ Release $TAG does not exist"
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create Release
      if: steps.validate_version.outputs.VALID == 'true' && steps.check_release.outputs.RELEASE_EXISTS == 'false'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_artifact.outputs.TAG }}
        name: "${{ steps.get_artifact.outputs.ARTIFACT_ID }} ${{ steps.get_artifact.outputs.VERSION }}"
        body: |
          ### Installation:
          1. Download `${{ steps.get_artifact.outputs.ARTIFACT_ID }}-${{ steps.get_artifact.outputs.VERSION }}.jar`
          2. Place into `plugins` folder of your Minecraft server
          3. Restart server or use `/reload`
          
          ### Build info:
          - **Build #:** ${{ github.run_number }}
          - **Commit:** ${{ github.sha }}
          - **Branch:** ${{ github.ref_name }}
        files: |
          target/*.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Log invalid version
      if: steps.validate_version.outputs.VALID == 'false'
      run: |
        echo "::error::${{ steps.validate_version.outputs.INVALID_REASON }}"
    
    - name: Log skipped release
      if: steps.validate_version.outputs.VALID == 'true' && steps.check_release.outputs.RELEASE_EXISTS == 'true'
      run: |
        echo "::warning::${{ steps.check_release.outputs.RELEASE_EXISTS_MESSAGE }}"
