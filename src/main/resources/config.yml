Debug: false

Elevator:
  BlockTypes:
    - CARPET
    - BLACK_CARPET
    - BLUE_CARPET
    - BROWN_CARPET
    - CYAN_CARPET
    - GRAY_CARPET
    - GREEN_CARPET
    - LIGHT_BLUE_CARPET
    - LIGHT_GRAY_CARPET
    - LIME_CARPET
    - MAGENTA_CARPET
    - ORANGE_CARPET
    - PINK_CARPET
    - PURPLE_CARPET
    - RED_CARPET
    - WHITE_CARPET
    - YELLOW_CARPET

  BlockDistance: 50
  EnableParticle: true
  ParticleType: SPELL_WITCH
  ParticleCount: 20
  UsageSound: entity.enderman.teleport
  ActivateSound: entity.player.levelup
  AllowUnsafe: true

Teleporter:
  EnableParticle: true
  UsageSound: entity.enderman.teleport
  AllowUnsafe: true
  AllowCrossWorlds: true

  # If true, ANY block can be bound with an ender pearl.
  # If false, only BlockTypes below (or permission below) can be bound.
  AllowAllBlocks: false

  # Permission that bypasses the BlockTypes list (empty = disabled)
  BlockTypesPermission: ""

  BlockTypes:
    - SEA_LANTERN
    - CRYING_OBSIDIAN
    - LIGHT_BLUE_GLAZED_TERRACOTTA

Cooldown:
  EnableCooldown: false
  Time: 30
  Locale: "&#FF5555Elevator is on cooldown. Please wait for another %time% seconds!"
  MessageType: SUBTITLE

ElevatorLocale:
  MessageType: SUBTITLE
  Title:
    FadeIn: 10
    Stay: 40
    FadeOut: 10
  ElevatorUp: "&#55FF55Going up"
  ElevatorDown: "&#FFAA00Going down"
  ElevatorDanger: "&#FF5555Danger! Unsafe location!"

TeleporterLocale:
  MessageType: SUBTITLE
  Title:
    FadeIn: 10
    Stay: 60
    FadeOut: 10

DisabledWorlds:
  - "world_nether"
  - "world_the_end"

Permissions:
  CheckPermission: false
  Use: "elevator.use"
  BypassCooldown: "elevator.bypass"
  Teleport: "elevator.teleport"
  Manage: "elevator.manage"
  BreakBypass: "elevator.break.bypass"

# Access values: OWNER, MEMBERS, OWNERS, ALL
TeleporterBlock:
  Teleport:
    Enabled: true
    CheckPermission: false
    Permission: "elevator.teleport"
    DefaultAccess: "ALL"
  Manage:
    Enabled: true
    CheckPermission: false
    Permission: "elevator.manage"
    DefaultAccess: "OWNER"
  Break:
    Enabled: true
    CheckPermission: false
    Permission: "elevator.break"
    DefaultAccess: "ALL"
