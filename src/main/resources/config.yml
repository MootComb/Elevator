# ============================================================
#  Debug
# ============================================================
# Enable verbose logging to console.
Debug: false

# ============================================================
#  Elevator
# ============================================================
# Elevator = jump up / sneak down on matching blocks.
Elevator:
  # Blocks that act as elevator platforms.
  BlockTypes:
    - CARPET
    - BLACK_CARPET
    - BLUE_CARPET
    - BROWN_CARPET
    - CYAN_CARPET
    - GRAY_CARPET
    - GREEN_CARPET
    - LIGHT_BLUE_CARPET
    - LIGHT_GRAY_CARPET
    - LIME_CARPET
    - MAGENTA_CARPET
    - ORANGE_CARPET
    - PINK_CARPET
    - PURPLE_CARPET
    - RED_CARPET
    - WHITE_CARPET
    - YELLOW_CARPET
  # Max vertical distance to search for the next elevator block.
  BlockDistance: 100
  # Particles on elevator use.
  EnableParticle: false
  ParticleType: SPELL_WITCH
  ParticleCount: 20
  # Sounds on elevator use / activation.
  UsageSound: entity.enderman.teleport
  ActivateSound: entity.player.levelup
  # Allow teleporting to unsafe locations (lava, fire, etc).
  AllowUnsafe: true

# ============================================================
#  Teleporter
# ============================================================
# Teleporter = paired blocks bound with an ID.
Teleporter:
  # Particles on teleport.
  EnableParticle: false
  ParticleType: SPELL_WITCH
  ParticleCount: 20
  # Sounds on teleport / bind.
  UsageSound: entity.enderman.teleport
  ActivateSound: entity.player.levelup
  # Allow teleporting to unsafe locations (lava, fire, etc).
  AllowUnsafe: true
  # If true, any block can be bound as a teleporter.
  # If false, only BlockTypes below (or with BlockTypesPermission) can be bound.
  AllowAllBlocks: false
  # Optional permission that allows binding any block (overrides BlockTypes).
  BlockTypesPermission: ""
  # Allowed block types when AllowAllBlocks: false.
  BlockTypes:
    - SEA_LANTERN
    - CRYING_OBSIDIAN
    - LIGHT_BLUE_GLAZED_TERRACOTTA
  # Items used to bind a block as a teleporter (sneak + right-click).
  Bind:
    Items:
      ENDER_PEARL:
        # Consume the item on bind.
        Consume: true
        ConsumeAmount: 1
        # If Require: true, the player must have Permission to use this item.
        Require: false
        Permission: "teleporter.bind.pearl"
      EYE_OF_ENDER:
        Consume: true
        ConsumeAmount: 1
        Require: false
        Permission: "teleporter.bind.eye"

# ============================================================
#  Usage
# ============================================================
# Controls whether a player can USE a block type at all
# (elevator / teleporter). If disabled or permission missing,
# the block does nothing for that player.
Usage:
  Elevator:
    Enabled: true
    Require: false
    Permission: "elevator.use"

  Teleport:
    Enabled: true
    Require: false
    Permission: "teleporter.teleport"

# ============================================================
#  Features
# ============================================================
# Controls whether a player can MANAGE a specific category
# inside the block GUI. Disabling a feature hides/blocks its
# toggle button in the menu.
Features:
  ClickType:
    Enabled: true
    Require: false
    Permission: "teleporter.features.clicktype"

  # If requireSneak is true, teleport happens with SHIFT and GUI opens WITHOUT shift.
  # If requireSneak is false, teleport happens WITHOUT shift and GUI opens WITH shift.
  RequireSneak:
    Enabled: true
    Require: false
    Permission: "teleporter.features.sneak"

  # Required item category (set required item to use the teleporter).
  Bind:
    Enabled: true
    Require: false
    Permission: "teleporter.features.bind"

  TeleportLocation:
    Enabled: true
    Require: false
    Permission: "teleporter.features.teleportlocation"

  Naming:
    Enabled: true
    Require: false
    Permission: "teleporter.features.naming"

  Hologram:
    Enabled: true
    Require: false
    Permission: "teleporter.features.hologram"

  Redirect:
    Enabled: true
    Require: false
    Permission: "teleporter.features.redirect"

  # Default access level for newly bound blocks.
  # Values: OWNER / MEMBERS / GOVERNINGS / ALL
  TeleportAccess:
    Enabled: true
    Require: false
    Permission: "teleporter.features.teleportaccess"
    DefaultAccess: "ALL"

  ManageAccess:
    Enabled: true
    Require: false
    Permission: "teleporter.features.manage"
    DefaultAccess: "OWNER"

  # Allow adding/removing members and governings in the GUI.
  PeopleUse:
    Enabled: true
    Require: false
    Permission: "teleporter.features.peopleuse"

  BreakAccess:
    Enabled: true
    Require: false
    Permission: "teleporter.features.break"
    DefaultAccess: "ALL"

  Password:
    Enabled: true
    Require: false
    Permission: "teleporter.features.password"

# ============================================================
#  Restrictions
# ============================================================
Restrictions:
  # Cooldown between teleports.
  Cooldown:
    Enabled: false
    Time: 30
    MessageType: SUBTITLE
    Locale: "&#FF5300Teleporter &7| &fCooldown: %time%s"
    Exempt:
      Require: true
      Permission: "teleporter.bypass"

  # Enforce access level checks.
  Access:
    Enabled: true
    Exempt:
      Require: true
      Permission: "teleporter.bypass.access"

  # Enforce required item checks.
  Item:
    Enabled: true
    Exempt:
      Require: true
      Permission: "teleporter.bypass.item"

  # Enforce sneak requirement.
  Sneak:
    Enabled: true
    Exempt:
      Require: true
      Permission: "teleporter.bypass.sneak"

  # Max distance between source and destination.
  Distance:
    Enabled: true
    MaxDistance: 10000.0
    Exempt:
      Require: true
      Permission: "teleporter.bypass.distance"

  # Cross-world teleport restriction.
  CrossWorld:
    Enabled: true
    Allow: true
    Exempt:
      Require: true
      Permission: "teleporter.bypass.crossworld"

# ============================================================
#  Commands
# ============================================================
Commands:
  Info:
    Enabled: true
    Require: false
    Permission: "teleporter.info"
  List:
    Enabled: true
    Require: false
    Permission: "teleporter.list"
  Remove:
    Enabled: true
    Require: false
    Permission: "teleporter.remove"
  Menu:
    Enabled: true
    Require: false
    Permission: "teleporter.menu"
  Tp:
    Enabled: true
    Require: true
    Permission: "teleporter.tp"
  Reload:
    Enabled: true
    Require: true
    Permission: "teleporter.reload"
  View:
    Enabled: true
    All:
      Require: false
      Permission: "teleporter.view.all"
    Owner:
      Require: false
      Permission: "teleporter.view.owner"
    Member:
      Require: false
      Permission: "teleporter.view.member"

