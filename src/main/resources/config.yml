Debug: false

Elevator:
  BlockTypes:
    - CARPET
    - BLACK_CARPET
    - BLUE_CARPET
    - BROWN_CARPET
    - CYAN_CARPET
    - GRAY_CARPET
    - GREEN_CARPET
    - LIGHT_BLUE_CARPET
    - LIGHT_GRAY_CARPET
    - LIME_CARPET
    - MAGENTA_CARPET
    - ORANGE_CARPET
    - PINK_CARPET
    - PURPLE_CARPET
    - RED_CARPET
    - WHITE_CARPET
    - YELLOW_CARPET

  BlockDistance: 50
  EnableParticle: true
  ParticleType: SPELL_WITCH
  ParticleCount: 20
  UsageSound: entity.enderman.teleport
  ActivateSound: entity.player.levelup
  AllowUnsafe: true

Teleporter:
  EnableParticle: true
  UsageSound: entity.enderman.teleport
  AllowUnsafe: true
  AllowCrossWorlds: true
  AllowAllBlocks: false
  BlockTypesPermission: ""

  BlockTypes:
    - SEA_LANTERN
    - CRYING_OBSIDIAN
    - LIGHT_BLUE_GLAZED_TERRACOTTA

  DistanceCheck:
    Enabled: true
    MaxDistance: 10000.0

Cooldown:
  EnableCooldown: false
  Time: 30
  Locale: "&#FF5300Elevator &7| &fCooldown: %time%s"
  MessageType: SUBTITLE

ElevatorLocale:
  MessageType: SUBTITLE
  Title:
    FadeIn: 10
    Stay: 40
    FadeOut: 10
  ElevatorUp: "&#FF5300Elevator &7| &fGoing up"
  ElevatorDown: "&#FF5300Elevator &7| &fGoing down"
  ElevatorDanger: "&#FF5300Elevator &7| &fDanger! Unsafe location!"

TeleporterLocale:
  MessageType: SUBTITLE
  Title:
    FadeIn: 10
    Stay: 60
    FadeOut: 10

DisabledWorlds:
  - "world_nether"
  - "world_the_end"

Permissions:
  CheckPermission: false
  Use: "elevator.use"
  BypassCooldown: "elevator.bypass"
  Teleport: "elevator.teleport"
  Manage: "elevator.manage"
  BreakBypass: "elevator.break.bypass"

# Access values: OWNER, MEMBERS, OWNERS, ALL
# Teleport Location values: TOP, CURRENT
TeleporterBlock:
  Teleport:
    Enabled: true
    CheckPermission: false
    Permission: "elevator.teleport"
    DefaultAccess: "ALL"
  Manage:
    Enabled: true
    CheckPermission: false
    Permission: "elevator.manage"
    DefaultAccess: "OWNER"
  Break:
    Enabled: true
    CheckPermission: false
    Permission: "elevator.break"
    DefaultAccess: "ALL"

GUI:
  Main:
    Title: "&7Teleporter Block"
  Members:
    Title: "&7Members & Owners"
  List:
    Title: "&7%list%"

