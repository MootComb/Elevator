Debug: false

Elevator:
  BlockTypes:
    - CARPET
    - BLACK_CARPET
    - BLUE_CARPET
    - BROWN_CARPET
    - CYAN_CARPET
    - GRAY_CARPET
    - GREEN_CARPET
    - LIGHT_BLUE_CARPET
    - LIGHT_GRAY_CARPET
    - LIME_CARPET
    - MAGENTA_CARPET
    - ORANGE_CARPET
    - PINK_CARPET
    - PURPLE_CARPET
    - RED_CARPET
    - WHITE_CARPET
    - YELLOW_CARPET
  BlockDistance: 50
  EnableParticle: false
  ParticleType: SPELL_WITCH
  ParticleCount: 20
  UsageSound: entity.enderman.teleport
  ActivateSound: entity.player.levelup
  AllowUnsafe: true

Teleporter:
  EnableParticle: false
  ParticleType: SPELL_WITCH
  ParticleCount: 20
  UsageSound: entity.enderman.teleport
  ActivateSound: entity.player.levelup
  AllowUnsafe: true
  AllowAllBlocks: true
  BlockTypesPermission: ""
  BlockTypes:
    - SEA_LANTERN
    - CRYING_OBSIDIAN
    - LIGHT_BLUE_GLAZED_TERRACOTTA
  Bind:
    Items:
      ENDER_PEARL:
        Consume: true
        ConsumeAmount: 1
        Require: false
        Permission: "teleporter.bind.pearl"
      EYE_OF_ENDER:
        Consume: true
        ConsumeAmount: 1
        Require: false
        Permission: "teleporter.bind.eye"

Features:
  Teleport:
    Enabled: true
    Require: false
    Permission: "teleporter.teleport"
    DefaultAccess: "ALL"
  Manage:
    Enabled: true
    Require: false
    Permission: "teleporter.manage"
    DefaultAccess: "OWNER"
  Break:
    Enabled: true
    Require: false
    Permission: "teleporter.break"
    DefaultAccess: "ALL"
  Bind:
    Enabled: true
    Require: false
    Permission: "teleporter.bind"
  Password:
    Enabled: true
    Require: false
    Permission: "teleporter.password"
  Redirect:
    Enabled: true
    Require: false
    Permission: "teleporter.redirect"
  Hologram:
    Enabled: true
    Require: false
    Permission: "teleporter.hologram"
  Naming:
    Enabled: true
    Require: false
    Permission: "teleporter.naming"
  Elevator:
    Enabled: true
    Require: false
    Permission: "elevator.use"

Restrictions:
  Cooldown:
    Enabled: false
    Time: 30
    MessageType: SUBTITLE
    Locale: "&#FF5300Teleporter &7| &fCooldown: %time%s"
    Exempt:
      Require: true
      Permission: "teleporter.bypass"
  Access:
    Enabled: true
    Exempt:
      Require: true
      Permission: "teleporter.bypass.access"
  Item:
    Enabled: true
    Exempt:
      Require: true
      Permission: "teleporter.bypass.item"
  Sneak:
    Enabled: true
    Exempt:
      Require: true
      Permission: "teleporter.bypass.sneak"
  Distance:
    Enabled: true
    MaxDistance: 10000.0
    Exempt:
      Require: true
      Permission: "teleporter.bypass.distance"
  CrossWorld:
    Enabled: true
    Allow: true
    Exempt:
      Require: true
      Permission: "teleporter.bypass.crossworld"

Commands:
  Info:
    Enabled: true
    Require: false
    Permission: "teleporter.info"
  List:
    Enabled: true
    Require: false
    Permission: "teleporter.list"
  Remove:
    Enabled: true
    Require: false
    Permission: "teleporter.remove"
  Menu:
    Enabled: true
    Require: false
    Permission: "teleporter.menu"
  Tp:
    Enabled: true
    Require: true
    Permission: "teleporter.tp"
  Reload:
    Enabled: true
    Require: true
    Permission: "teleporter.reload"
  View:
    Enabled: true
    All:
      Require: false
      Permission: "teleporter.view.all"
    Owner:
      Require: false
      Permission: "teleporter.view.owner"
    Member:
      Require: false
      Permission: "teleporter.view.member"

