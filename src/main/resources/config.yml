Titles:
  Elevator:
    FadeIn: 10
    Stay: 30
    FadeOut: 10
  Teleporter:
    FadeIn: 10
    Stay: 30
    FadeOut: 10

View:
  DurationTicks: 200
  UpdateEveryTicks: 5
  MaxDistance: 64
  ParticleCount: 3
  ParticleType: END_ROD

Holograms:
  DefaultEnabled: false
  DefaultColor: "&f"
  ViewDistance: 16
  UpdateIntervalTicks: 20
  LineHeight: 0.3

BlockNaming:
  Enabled: true
  MaxLength: 64
  DefaultName: ""
  DefaultColor: "&f"

DisabledWorlds:
  Elevator:
    - "world_nether"
    - "world_the_end"
  Teleporter:
    - "world_nether"
    - "world_the_end"

GUI:
  Menus:
    main:
      title: "&8Teleporter Block"
      size: 54
      items:
        id:
          material: ENDER_PEARL
          slot: 4
          display_name: "&#FF5300ID: %id%"
          lore:
            - "&fClick to change ID"
          left_click_commands:
            - "[teleporter_input] SET_ID"
        click_type:
          material: LEVER
          slot: 19
          display_name: "&#FF5300Click Type: %click%"
          lore:
            - "&fLeft or Right mouse button"
          left_click_commands:
            - "[teleporter_toggle] click"
        sneak:
          material: SHIELD
          slot: 20
          display_name: "&#FF5300Require Sneak: %sneak%"
          lore:
            - "&fToggle sneak requirement"
          left_click_commands:
            - "[teleporter_toggle] sneak"
        required_item:
          material: NAME_TAG
          slot: 21
          display_name: "&#FF5300Require Item: %item%"
          lore:
            - "&fRequired: %value%"
            - "&fClick to change"
          left_click_commands:
            - "[teleporter_input] SET_ITEM"
        location:
          material: ENDER_EYE
          slot: 22
          display_name: "&#FF5300Teleport Location: %location%"
          lore:
            - "&fTOP or CURRENT"
            - "&fClick to cycle"
          left_click_commands:
            - "[teleporter_toggle] location"
        name:
          material: BOOK
          slot: 23
          display_name: "&#FF5300Name: %blockname%"
          lore:
            - "&fClick to rename"
          left_click_commands:
            - "[teleporter_input] SET_NAME"
        hologram:
          material: ARMOR_STAND
          slot: 24
          display_name: "&#FF5300Hologram: %hologram%"
          lore:
            - "&fToggle hologram above block"
          left_click_commands:
            - "[teleporter_toggle] hologram"
        redirect:
          material: COMPASS
          slot: 25
          display_name: "&#FF5300Redirect: %redirect%"
          lore:
            - "&fClick to open chain editor"
          left_click_commands:
            - "[opengui] redirect"
        close:
          material: BARRIER
          slot: 49
          display_name: "&#FF5300Close"
          left_click_commands:
            - "[close]"
        teleport_access:
          material: CHEST
          slot: 29
          display_name: "&#FF5300Teleport Access: %teleport_access%"
          lore:
            - "&fClick to cycle"
            - "&fOWNER / MEMBERS / GOVERNINGS / ALL"
          left_click_commands:
            - "[teleporter_toggle] teleport_access"
        manage_access:
          material: COMMAND_BLOCK
          slot: 30
          display_name: "&#FF5300Manage Access: %manage_access%"
          lore:
            - "&fClick to cycle"
            - "&fOWNER / MEMBERS / GOVERNINGS / ALL"
          left_click_commands:
            - "[teleporter_toggle] manage_access"
        break_access:
          material: DIAMOND_PICKAXE
          slot: 32
          display_name: "&#FF5300Break Access: %break_access%"
          lore:
            - "&fClick to cycle"
            - "&fOWNER / MEMBERS / GOVERNINGS / ALL"
          left_click_commands:
            - "[teleporter_toggle] break_access"
        members:
          material: PLAYER_HEAD
          slot: 31
          display_name: "&#FF5300Members & Governings"
          lore:
            - "&fManage local and global lists"
          left_click_commands:
            - "[opengui] members"
        password:
          material: TRIPWIRE_HOOK
          slot: 33
          display_name: "&#FF5300Password: %password%"
          lore:
            - "&fClick to set / disable"
          left_click_commands:
            - "[teleporter_input] SET_PASSWORD"

    members:
      title: "&8Members & Governings"
      size: 54
      items:
        local_members:
          material: PLAYER_HEAD
          slot: 20
          display_name: "&#FF5300Local Members: %count%"
          lore:
            - "&fClick to manage"
          left_click_commands:
            - "[opengui_list] LOCAL_MEMBERS"
        local_governings:
          material: PLAYER_HEAD
          slot: 21
          display_name: "&#FF5300Local Governings: %count%"
          lore:
            - "&fClick to manage"
          left_click_commands:
            - "[opengui_list] LOCAL_GOVERNINGS"
        global_members:
          material: PLAYER_HEAD
          slot: 23
          display_name: "&#FF5300Global Members: %count%"
          lore:
            - "&fClick to manage"
          left_click_commands:
            - "[opengui_list] GLOBAL_MEMBERS"
        global_governings:
          material: PLAYER_HEAD
          slot: 24
          display_name: "&#FF5300Global Governings: %count%"
          lore:
            - "&fClick to manage"
          left_click_commands:
            - "[opengui_list] GLOBAL_GOVERNINGS"
        back:
          material: ARROW
          slot: 49
          display_name: "&#FF5300Back"
          left_click_commands:
            - "[opengui] main"

    list:
      title: "&8%list%"
      size: 54
      dynamic:
        player_entry:
          material: PLAYER_HEAD
          display_name: "&#FF5300%name%"
          lore:
            - "&fClick to remove"
          left_click_commands:
            - "[teleporter_list_remove] %uuid%"
        slots:
          start: 0
          end: 44
      items:
        previous:
          material: ARROW
          slot: 45
          display_name: "&#FF5300Previous"
          left_click_commands:
            - "[teleporter_page] previous"
        next:
          material: ARROW
          slot: 53
          display_name: "&#FF5300Next"
          left_click_commands:
            - "[teleporter_page] next"
        back:
          material: ARROW
          slot: 49
          display_name: "&#FF5300Back"
          left_click_commands:
            - "[opengui] members"
        add:
          material: EMERALD
          slot: 48
          display_name: "&#FF5300Add player"
          lore:
            - "&fClick to add a player by name"
          left_click_commands:
            - "[teleporter_input] ADD_PLAYER"

    redirect:
      title: "&8Redirect Chain"
      size: 54
      items:
        toggle:
          material: LEVER
          slot: 4
          display_name: "&#FF5300Redirect: %redirect%"
          lore:
            - "&fToggle redirect mode"
          left_click_commands:
            - "[teleporter_toggle] redirect"
        add:
          material: EMERALD
          slot: 45
          display_name: "&#FF5300Add ID"
          lore:
            - "&fClick to add an ID to the chain"
          left_click_commands:
            - "[teleporter_input] ADD_STEP"
        clear:
          material: LAVA_BUCKET
          slot: 48
          display_name: "&#FF5300Clear chain"
          lore:
            - "&fClick to remove all IDs"
          left_click_commands:
            - "[teleporter_input] CLEAR_STEPS"
        back:
          material: ARROW
          slot: 49
          display_name: "&#FF5300Back"
          left_click_commands:
            - "[opengui] main"
      dynamic:
        step_entry:
          material: PAPER
          display_name: "&#FF5300Step %index%: ID %id%"
          lore:
            - "&fClick to remove"
          left_click_commands:
            - "[teleporter_redirect_remove] %index%"
        slots:
          start: 9
          end: 44
