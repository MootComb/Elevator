# ============================================
# ELEVATOR PLUGIN CONFIGURATION
# ============================================

Debug: false

# ============================================
# ELEVATOR SETTINGS
# ============================================
Elevator:
  BlockTypes:
    - CARPET
    - BLACK_CARPET
    - BLUE_CARPET
    - BROWN_CARPET
    - CYAN_CARPET
    - GRAY_CARPET
    - GREEN_CARPET
    - LIGHT_BLUE_CARPET
    - LIGHT_GRAY_CARPET
    - LIME_CARPET
    - MAGENTA_CARPET
    - ORANGE_CARPET
    - PINK_CARPET
    - PURPLE_CARPET
    - RED_CARPET
    - WHITE_CARPET
    - YELLOW_CARPET
  BlockDistance: 50
  EnableParticle: true
  ParticleType: SPELL_WITCH
  ParticleCount: 20
  UsageSound: entity.enderman.teleport
  ActivateSound: entity.player.levelup
  AllowUnsafe: true

# ============================================
# TELEPORTER SETTINGS
# ============================================
Teleporter:
  EnableParticle: true
  UsageSound: entity.enderman.teleport
  AllowUnsafe: true
  AllowCrossWorlds: true
  AllowAllBlocks: false
  BlockTypesPermission: ""
  BlockTypes:
    - SEA_LANTERN
    - CRYING_OBSIDIAN
    - LIGHT_BLUE_GLAZED_TERRACOTTA
  DistanceCheck:
    Enabled: true
    MaxDistance: 10000.0
  Bind:
    ConsumePearl: true

# ============================================
# COOLDOWN SETTINGS
# ============================================
Cooldown:
  EnableCooldown: false
  Time: 30
  MessageType: SUBTITLE
  Locale: "&#FF5300Elevator &7| &fCooldown: %time%s"

# ============================================
# MESSAGES
# ============================================
Messages:
  Prefix: "&#FF5300Elevator &7| &f"
  IdPrompt: "&fType a number (1-99999) or 'cancel'."
  IdPromptType: CHAT
  IdInvalid: "&fInvalid number."
  IdInvalidType: CHAT
  IdRange: "&fNumber must be 1-99999."
  IdRangeType: CHAT
  IdUsed: "&fThis ID is already used by 2 blocks."
  IdUsedType: CHAT
  IdSet: "&fID set to %id%"
  IdSetType: CHAT
  ItemPrompt: "&fType item name or 'no' to disable."
  ItemPromptType: CHAT
  ItemDisabled: "&fItem requirement disabled."
  ItemDisabledType: CHAT
  ItemSet: "&fRequired item: %name%"
  ItemSetType: CHAT
  NamePrompt: "&fType a name or 'cancel'."
  NamePromptType: CHAT
  NameSet: "&fName set to: %name%"
  NameSetType: CHAT
  PasswordPrompt: "&fType a password or 'no' to disable."
  PasswordPromptType: CHAT
  PasswordSet: "&fPassword set."
  PasswordSetType: CHAT
  PasswordDisabled: "&fPassword disabled."
  PasswordDisabledType: CHAT
  PasswordRequired: "&fType the password in chat or 'cancel'."
  PasswordRequiredType: CHAT
  PasswordWrong: "&fWrong password."
  PasswordWrongType: CHAT
  PasswordOk: "&fPassword accepted."
  PasswordOkType: CHAT
  RedirectPrompt: "&fType an ID to add to the chain or 'cancel'."
  RedirectPromptType: CHAT
  RedirectAdded: "&fAdded ID %id% to chain."
  RedirectAddedType: CHAT
  RedirectRemoved: "&fRemoved ID %id% from chain."
  RedirectRemovedType: CHAT
  RedirectEmpty: "&fRedirect chain is empty."
  RedirectEmptyType: CHAT
  Cancelled: "&fCancelled."
  CancelledType: CHAT
  NoPermission: "&fNo permission."
  NoPermissionType: CHAT
  BlockGone: "&fBlock no longer exists."
  BlockGoneType: CHAT
  PlayerNotFound: "&fPlayer not found."
  PlayerNotFoundType: CHAT
  PlayerAdded: "&fAdded %name%"
  PlayerAddedType: CHAT
  NoBlockInSight: "&fNo block in sight."
  NoBlockInSightType: CHAT
  NotTeleporter: "&fThis block is not a teleporter."
  NotTeleporterType: CHAT
  NoBlocksOwned: "&fYou have no teleporter blocks."
  NoBlocksOwnedType: CHAT
  YourBlocks: "&fYour teleporter blocks:"
  YourBlocksType: CHAT
  RemoveUsage: "&fUsage: /elevator remove <id>"
  RemoveUsageType: CHAT
  RemoveInvalid: "&fInvalid ID."
  RemoveInvalidType: CHAT
  RemoveNone: "&fNo blocks with that ID."
  RemoveNoneType: CHAT
  RemoveNotOwner: "&fYou do not own any block with that ID."
  RemoveNotOwnerType: CHAT
  RemoveSuccess: "&fRemoved %count% block(s) with ID %id%"
  RemoveSuccessType: CHAT
  UnknownSub: "&fUnknown subcommand."
  UnknownSubType: CHAT
  PlayersOnly: "&fPlayers only."
  PlayersOnlyType: CHAT
  Reloaded: "&fConfig reloaded!"
  ReloadedType: CHAT
  ListPrompt: "&fType player name or 'cancel'."
  ListPromptType: CHAT
  HeaderInfo: "&fBlock info:"
  HeaderInfoType: CHAT
  ViewDisabled: "&fView mode disabled."
  ViewDisabledType: CHAT
  ViewEnabled: "&fView mode: %mode%"
  ViewEnabledType: CHAT
  ViewUsage: "&fUsage: /elevator view <all|owner|member>"
  ViewUsageType: CHAT
  TeleportSuccess: "&fTeleported!"
  TeleportSuccessType: SUBTITLE
  ElevatorUp: "&fGoing up"
  ElevatorUpType: SUBTITLE
  ElevatorDown: "&fGoing down"
  ElevatorDownType: SUBTITLE
  ElevatorDanger: "&fDanger! Unsafe location!"
  ElevatorDangerType: SUBTITLE
  NoPair: "&fNo paired block found."
  NoPairType: CHAT
  NoCrossWorld: "&fCannot teleport across worlds."
  NoCrossWorldType: CHAT
  MissingItem: "&fYou are missing the required item."
  MissingItemType: CHAT
  DistanceTooFar: "&fDestination is too far away."
  DistanceTooFarType: CHAT
  BlockBound: "&fBlock bound! Set an ID to link it."
  BlockBoundType: CHAT

# ============================================
# TITLE SETTINGS
# ============================================
Titles:
  Elevator:
    FadeIn: 10
    Stay: 40
    FadeOut: 10
  Teleporter:
    FadeIn: 10
    Stay: 60
    FadeOut: 10

# ============================================
# VIEW MODE
# ============================================
View:
  DurationTicks: 200
  UpdateEveryTicks: 5
  MaxDistance: 64
  ParticleCount: 3
  ParticleType: END_ROD
  PermissionAll: "elevator.view.all"
  PermissionOwner: "elevator.view.owner"
  PermissionMember: "elevator.view.member"

# ============================================
# HOLOGRAMS
# ============================================
Holograms:
  DefaultEnabled: false
  DefaultColor: "&f"
  ViewDistance: 16
  UpdateIntervalTicks: 20
  LineHeight: 0.3

# ============================================
# BLOCK NAMING
# ============================================
BlockNaming:
  Enabled: true
  MaxLength: 64
  DefaultName: ""
  DefaultColor: "&f"

# ============================================
# DISABLED WORLDS
# ============================================
DisabledWorlds:
  - "world_nether"
  - "world_the_end"

# ============================================
# PERMISSIONS
# ============================================
Permissions:
  CheckPermission: false
  Use: "elevator.use"
  BypassCooldown: "elevator.bypass"
  Teleport: "elevator.teleport"
  Manage: "elevator.manage"
  BreakBypass: "elevator.break.bypass"
  Bypass:
    Access: "elevator.bypass.access"
    Distance: "elevator.bypass.distance"
    Item: "elevator.bypass.item"
    Sneak: "elevator.bypass.sneak"

# ============================================
# TELEPORTER BLOCK FEATURES
# ============================================
TeleporterBlock:
  Teleport:
    Enabled: true
    CheckPermission: false
    Permission: "elevator.teleport"
    DefaultAccess: "ALL"
  Manage:
    Enabled: true
    CheckPermission: false
    Permission: "elevator.manage"
    DefaultAccess: "OWNER"
  Break:
    Enabled: true
    CheckPermission: false
    Permission: "elevator.break"
    DefaultAccess: "ALL"

# ============================================
# GUI MENUS
# Style: DeluxeMenus-like
# Placeholders:
#   %id% %name% %click% %sneak% %item% %location%
#   %teleport_access% %manage_access% %break_access%
#   %password% %redirect% %members% %governings%
#   %count% %list% %name% %index% %value% %page% %pages%
# ============================================
GUI:
  Menus:
    # --------------------------------------------
    # Main block menu
    # --------------------------------------------
    main:
      title: "&8Teleporter Block"
      size: 54
      items:
        id:
          material: ENDER_PEARL
          slot: 4
          display_name: "&#FF5300ID: %id%"
          lore:
            - "&fClick to change ID"
          left_click_commands:
            - "[elevator_input] SET_ID"
        click_type:
          material: LEVER
          slot: 19
          display_name: "&#FF5300Click Type: %click%"
          lore:
            - "&fLeft or Right mouse button"
          left_click_commands:
            - "[elevator_toggle] click"
        sneak:
          material: SHIELD
          slot: 20
          display_name: "&#FF5300Require Sneak: %sneak%"
          lore:
            - "&fToggle sneak requirement"
          left_click_commands:
            - "[elevator_toggle] sneak"
        required_item:
          material: NAME_TAG
          slot: 21
          display_name: "&#FF5300Require Item: %item%"
          lore:
            - "&fRequired: %value%"
            - "&fClick to change"
          left_click_commands:
            - "[elevator_input] SET_ITEM"
        location:
          material: ENDER_EYE
          slot: 22
          display_name: "&#FF5300Teleport Location: %location%"
          lore:
            - "&fTOP or CURRENT"
            - "&fClick to cycle"
          left_click_commands:
            - "[elevator_toggle] location"
        name:
          material: BOOK
          slot: 23
          display_name: "&#FF5300Name: %name%"
          lore:
            - "&fClick to rename"
          left_click_commands:
            - "[elevator_input] SET_NAME"
        hologram:
          material: ARMOR_STAND
          slot: 24
          display_name: "&#FF5300Hologram: %value%"
          lore:
            - "&fToggle hologram above block"
          left_click_commands:
            - "[elevator_toggle] hologram"
        teleport_access:
          material: PLAYER_HEAD
          slot: 29
          display_name: "&#FF5300Teleport Access: %teleport_access%"
          lore:
            - "&fClick to cycle"
            - "&fOWNER / MEMBERS / GOVERNINGS / ALL"
          left_click_commands:
            - "[elevator_toggle] teleport_access"
        manage_access:
          material: COMMAND_BLOCK
          slot: 30
          display_name: "&#FF5300Manage Access: %manage_access%"
          lore:
            - "&fClick to cycle"
            - "&fOWNER / GOVERNINGS / ALL"
          left_click_commands:
            - "[elevator_toggle] manage_access"
        break_access:
          material: DIAMOND_PICKAXE
          slot: 31
          display_name: "&#FF5300Break Access: %break_access%"
          lore:
            - "&fClick to cycle"
            - "&fOWNER / MEMBERS / GOVERNINGS / ALL"
          left_click_commands:
            - "[elevator_toggle] break_access"
          view_requirement:
            type: "holding_item"
            material: DIAMOND_PICKAXE
        members:
          material: CHEST
          slot: 32
          display_name: "&#FF5300Members & Governings"
          lore:
            - "&fManage local and global lists"
          left_click_commands:
            - "[opengui] members"
        password:
          material: TRIPWIRE_HOOK
          slot: 33
          display_name: "&#FF5300Password: %password%"
          lore:
            - "&fClick to set / disable"
          left_click_commands:
            - "[elevator_input] SET_PASSWORD"
        redirect:
          material: ENDER_EYE
          slot: 34
          display_name: "&#FF5300Redirect: %redirect%"
          lore:
            - "&fClick to open chain editor"
          left_click_commands:
            - "[opengui] redirect"
        close:
          material: BARRIER
          slot: 49
          display_name: "&#FF5300Close"
          left_click_commands:
            - "[close]"

    # --------------------------------------------
    # Members & Governings menu
    # --------------------------------------------
    members:
      title: "&8Members & Governings"
      size: 54
      items:
        local_members:
          material: PLAYER_HEAD
          slot: 20
          display_name: "&#FF5300Local Members: %count%"
          lore:
            - "&fClick to manage"
          left_click_commands:
            - "[opengui_list] LOCAL_MEMBERS"
        local_governings:
          material: PLAYER_HEAD
          slot: 21
          display_name: "&#FF5300Local Governings: %count%"
          lore:
            - "&fClick to manage"
          left_click_commands:
            - "[opengui_list] LOCAL_GOVERNINGS"
        global_members:
          material: PLAYER_HEAD
          slot: 23
          display_name: "&#FF5300Global Members: %count%"
          lore:
            - "&fClick to manage"
          left_click_commands:
            - "[opengui_list] GLOBAL_MEMBERS"
        global_governings:
          material: PLAYER_HEAD
          slot: 24
          display_name: "&#FF5300Global Governings: %count%"
          lore:
            - "&fClick to manage"
          left_click_commands:
            - "[opengui_list] GLOBAL_GOVERNINGS"
        back:
          material: ARROW
          slot: 49
          display_name: "&#FF5300Back"
          left_click_commands:
            - "[opengui] main"

    # --------------------------------------------
    # Player list (members / governings)
    # --------------------------------------------
    list:
      title: "&8%list%"
      size: 54
      dynamic:
        # Placeholder for each player in the list
        player_entry:
          material: PLAYER_HEAD
          display_name: "&#FF5300%name%"
          lore:
            - "&fClick to remove"
          left_click_commands:
            - "[elevator_list_remove] %uuid%"
        # Slots range for entries (inclusive)
        slots:
          start: 0
          end: 44
      items:
        previous:
          material: ARROW
          slot: 45
          display_name: "&#FF5300Previous"
          left_click_commands:
            - "[elevator_page] previous"
        next:
          material: ARROW
          slot: 53
          display_name: "&#FF5300Next"
          left_click_commands:
            - "[elevator_page] next"
        back:
          material: ARROW
          slot: 49
          display_name: "&#FF5300Back"
          left_click_commands:
            - "[opengui] members"
        add:
          material: EMERALD
          slot: 48
          display_name: "&#FF5300Add player"
          lore:
            - "&fClick to add a player by name"
          left_click_commands:
            - "[elevator_input] ADD_PLAYER"

    # --------------------------------------------
    # Redirect chain editor
    # --------------------------------------------
    redirect:
      title: "&8Redirect Chain"
      size: 54
      items:
        toggle:
          material: LEVER
          slot: 4
          display_name: "&#FF5300Redirect: %value%"
          lore:
            - "&fToggle redirect mode"
          left_click_commands:
            - "[elevator_toggle] redirect"
        add:
          material: EMERALD
          slot: 45
          display_name: "&#FF5300Add ID"
          lore:
            - "&fClick to add an ID to the chain"
          left_click_commands:
            - "[elevator_input] ADD_STEP"
        clear:
          material: LAVA_BUCKET
          slot: 48
          display_name: "&#FF5300Clear chain"
          lore:
            - "&fClick to remove all IDs"
          left_click_commands:
            - "[elevator_input] CLEAR_STEPS"
        back:
          material: ARROW
          slot: 49
          display_name: "&#FF5300Back"
          left_click_commands:
            - "[opengui] main"
      dynamic:
        step_entry:
          material: PAPER
          display_name: "&#FF5300Step %index%: ID %id%"
          lore:
            - "&fClick to remove"
          left_click_commands:
            - "[elevator_redirect_remove] %index%"
        slots:
          start: 9
          end: 44
